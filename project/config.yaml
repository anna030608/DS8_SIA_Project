spike_detection:
  mention_percentile: 95        # NumMentions 상위 5%
  ma_windows: [7, 14, 30]       # 이동평균 기간

priority_score:
  weights:
    num_mentions: 0.5
    goldstein: 0.1
    avg_tone: 0.2
    geo_distance: 0.2

  avg_tone_threshold: -3        # 이하일 때만 가중치 적용

  # 대만 해협 중심 기준점
  taiwan_strait:
    lat: 24.0
    lon: 119.0

  # 거리 구간별 점수
  geo_distance_bins:
    - max_km: 22.2
      score: 1.0
    - max_km: 44.4
      score: 0.8
    - max_km: 88.9
      score: 0.6
    - max_km: 177.8
      score: 0.4
    - max_km: 355.6
      score: 0.2
    - max_km: 99999
      score: 0.0